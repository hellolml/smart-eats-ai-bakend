id: home_chef
name: Home Chef
version: 1.0.0
description: Help users cook with available ingredients and practical recipes.
enabled: true
priority: 80
activation:
  scenes:
    - home_chef
  intents:
    - cook_home
  keywords:
    - 做饭
    - 菜谱
    - 冰箱
    - 食材
    - 家里
    - 自己做
  min_score: 1
instructions:
  file: instructions.md
  max_chars: 3000
tools:
  allow:
    - get_fridge_items
    - rag_search_recipes
    - search_recipes
  require_global_allowlist: true
context:
  read:
    - user_message
    - history
    - memories
    - fridge_items
  write:
    - active_skills
safety:
  can_override_global_rules: false
  allow_external_tools: false
  max_tool_calls_per_turn: 3
