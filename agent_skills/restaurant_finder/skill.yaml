id: restaurant_finder
name: Restaurant Finder
version: 1.0.0
description: Help users find nearby restaurants and choose where to eat out.
enabled: true
priority: 70
activation:
  scenes:
    - restaurant
  intents:
    - eat_out
  keywords:
    - 附近
    - 餐厅
    - 饭店
    - 外面吃
    - 出去吃
    - 去哪吃
  min_score: 1
instructions:
  file: instructions.md
  max_chars: 3000
tools:
  allow:
    - get_ip_location
    - geocode_location
    - search_restaurants
    - get_weather
  require_global_allowlist: true
context:
  read:
    - user_message
    - history
    - cached_location
    - last_restaurants
  write:
    - active_skills
safety:
  can_override_global_rules: false
  allow_external_tools: false
  max_tool_calls_per_turn: 3
