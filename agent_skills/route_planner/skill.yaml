id: route_planner
name: Route Planner
version: 1.0.0
description: Help users plan routes to selected restaurants or destinations.
enabled: true
priority: 75
activation:
  scenes:
    - route
  intents:
    - route
  keywords:
    - 路线
    - 导航
    - 怎么去
    - 怎么走
    - 带我去
    - 前往
  min_score: 1
instructions:
  file: instructions.md
  max_chars: 3000
tools:
  allow:
    - geocode_location
    - plan_route
  require_global_allowlist: true
context:
  read:
    - user_message
    - cached_location
    - last_restaurants
    - latest_route
  write:
    - active_skills
safety:
  can_override_global_rules: false
  allow_external_tools: false
  max_tool_calls_per_turn: 2
