services:
  frontend:
    ports: []

  gateway:
    image: nginx:1.27-alpine
    container_name: smart-eats-gateway
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    networks:
      - smart-eats-net

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: smart-eats-certbot
    profiles: ["tools"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

volumes:
  certbot_www:
  certbot_conf:
